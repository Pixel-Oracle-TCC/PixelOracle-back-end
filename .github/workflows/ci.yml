name: CI

run-name: "${{ github.event_name == 'pull_request' && format('Validação do Pixel Oracle no pull request #{0}', github.event.pull_request.number) || format('Validação do Pixel Oracle em {0}', github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: mudanças
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ml: ${{ steps.filter.outputs.ml }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detecta o que o diff dispara
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}...${SHA}" > "$RUNNER_TEMP/changed.txt"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/changed.txt"
          else
            git diff --name-only "${BEFORE}...${SHA}" > "$RUNNER_TEMP/changed.txt"
          fi
          api=false
          ml=false
          compose=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              api/*|.github/scripts/*) api=true ;;
            esac
            case "$file" in
              ml-service/*) ml=true ;;
            esac
            case "$file" in
              docker-compose.yml|api/Dockerfile|ml-service/Dockerfile) compose=true ;;
            esac
            case "$file" in
              .github/workflows/ci.yml) api=true; ml=true; compose=true ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "ml=$ml" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          {
            echo "## O que este diff dispara"
            echo ""
            echo "| Job | Dispara |"
            echo "|-----|---------|"
            echo "| \`api\` | $api |"
            echo "| \`ml\` | $ml |"
            echo "| \`compose\` | $compose |"
            echo "| \`secrets\` | true |"
          } >> "$GITHUB_STEP_SUMMARY"

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Testes unitários
        id: unit
        working-directory: api
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/api-test.log"

      - name: Typecheck
        id: typecheck
        working-directory: api
        run: npm run typecheck

      - name: Build
        id: build
        working-directory: api
        run: npm run build

      - name: Audit
        id: audit
        working-directory: api
        run: npm audit --audit-level=critical

      - name: Docker build
        id: docker
        run: docker build -f api/Dockerfile api

      - name: Testa o texto do comentário
        if: always()
        run: node --test .github/scripts/pull-request-comment.test.mjs

      - name: Publica o quadro
        if: always()
        env:
          CI_LOG: ${{ runner.temp }}/api-test.log
          CI_FORMAT: node
          CI_CHECK: api
          CI_MARKER: pixel-oracle-ci:api
          CI_CONTRACT_LABEL: parseGamePitch
          CI_TITLE: Validação da API
          GITHUB_TOKEN: ${{ github.token }}
          CI_ROWS: |
            Testes unitários|${{ steps.unit.outcome }}|tests
            Typecheck|${{ steps.typecheck.outcome }}|o TypeScript fecha
            Build|${{ steps.build.outcome }}|o build gera a pasta de saída
            Audit crítico|${{ steps.audit.outcome }}|sem vulnerabilidade crítica
            Imagem Docker|${{ steps.docker.outcome }}|a imagem da API constrói
        run: node .github/scripts/pull-request-comment.mjs

  ml:
    name: ml
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements-ci.txt

      - name: Install
        run: pip install -r ml-service/requirements-ci.txt

      - name: Test pipeline
        id: unit
        working-directory: ml-service
        run: |
          set -o pipefail
          python scripts/test_pipeline.py 2>&1 | tee "$RUNNER_TEMP/ml-test.log"

      - name: Publica o quadro
        if: always()
        env:
          CI_LOG: ${{ runner.temp }}/ml-test.log
          CI_FORMAT: python
          CI_TITLE: Validação do ML
          CI_ROWS: |
            Testes sintéticos|${{ steps.unit.outcome }}|tests
        run: node .github/scripts/pull-request-comment.mjs

  compose:
    name: compose
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        id: validate
        run: docker compose config

      - name: Publica o quadro
        if: always()
        env:
          CI_TITLE: Validação do Compose
          CI_ROWS: |
            Arquivo Compose|${{ steps.validate.outcome }}|docker compose config fecha, sem buildar o ML
        run: node .github/scripts/pull-request-comment.mjs

  secrets:
    name: secrets
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        id: gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose

      - name: Publica o quadro
        if: always()
        env:
          CI_TITLE: Validação de segredos
          CI_ROWS: |
            Gitleaks|${{ steps.gitleaks.outcome }}|nenhuma chave nova no histórico
        run: node .github/scripts/pull-request-comment.mjs

  relatorio:
    name: relatório
    if: always()
    needs: [changes, api, ml, compose, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Quadro do pipeline
        env:
          API: ${{ needs.api.result }}
          ML: ${{ needs.ml.result }}
          COMPOSE: ${{ needs.compose.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          label() {
            case "$1" in
              success) echo "passou" ;;
              failure) echo "falhou" ;;
              skipped) echo "não rodou" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Pipeline"
            echo ""
            echo "| Check | Resultado |"
            echo "|-------|-----------|"
            echo "| \`api\` | $(label "$API") |"
            echo "| \`ml\` | $(label "$ML") |"
            echo "| \`compose\` | $(label "$COMPOSE") |"
            echo "| \`secrets\` | $(label "$SECRETS") |"
            echo ""
            echo "Um check em \"não rodou\" não foi afetado por este diff."
          } >> "$GITHUB_STEP_SUMMARY"
