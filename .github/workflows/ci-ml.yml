name: CI ML

on:
  pull_request:
    paths:
      - "ml-service/**"
      - ".github/workflows/ci-ml.yml"
  push:
    branches: [develop, main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ci-ml.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ml:
    name: ml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements-ci.txt

      - name: Install
        run: pip install -r ml-service/requirements-ci.txt

      - name: Test pipeline
        working-directory: ml-service
        run: |
          set -o pipefail
          python scripts/test_pipeline.py 2>&1 | tee "$RUNNER_TEMP/ml-test.log"

      - name: Resumo da validação
        if: always()
        run: |
          {
            echo "## Validação do ML"
            echo ""
            echo "Testes sintéticos do pipeline de reviews, sem banco e sem rede."
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/ml-test.log" 2>/dev/null || echo "O log de testes não foi gerado."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
