name: CI ML

on:
  pull_request:
    paths:
      - "ml-service/**"
      - ".github/workflows/ci-ml.yml"
  push:
    branches: [develop, main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ci-ml.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ml:
    name: ml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements-ci.txt

      - name: Install
        run: pip install -r ml-service/requirements-ci.txt

      - name: Test pipeline
        working-directory: ml-service
        run: python scripts/test_pipeline.py
