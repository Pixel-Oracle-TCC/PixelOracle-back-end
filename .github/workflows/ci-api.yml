name: CI API

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [develop, main]
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Testes unitários
        working-directory: api
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/api-test.log"

      - name: Resumo da validação
        if: always()
        run: |
          {
            echo "## Validação da API"
            echo ""
            echo "Testes unitários do contrato de entrada (\`parseGamePitch\`, usado no \`POST /api/report\`)."
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/api-test.log" 2>/dev/null || echo "O log de testes não foi gerado."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        working-directory: api
        run: npm run typecheck

      - name: Build
        working-directory: api
        run: npm run build

      - name: Audit
        working-directory: api
        run: npm audit --audit-level=critical

      - name: Docker build
        run: docker build -f api/Dockerfile api
