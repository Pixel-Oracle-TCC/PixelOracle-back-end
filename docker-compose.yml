# Pixel Oracle — Postgres+pgvector + ML (8000) + API principal (3000)
# Uso: docker compose up --build
# Schema: todas as migrations rodam no primeiro start do serviço db (volume vazio).
# Banco já existente: rode `python scripts/apply_schema.py` no ml-service (idempotente).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pixel-oracle-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: pixel
      POSTGRES_DB: pixeloracle
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ml-service/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel -d pixeloracle"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pixel-oracle-ml
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/data:/app/data:ro
    environment:
      DATABASE_URL: postgresql://pixel:pixel@db:5432/pixeloracle
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      SIMILAR_GAMES_TOP_K: "5"
    env_file:
      - path: .env
        required: false
      - path: ./ml-service/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pixel-oracle-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ML_SERVICE_URL: http://ml-service:8000
      DATABASE_URL: postgresql://pixel:pixel@db:5432/pixeloracle
    env_file:
      - path: ./api/.env
        required: false
      - path: .env
        required: false
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
